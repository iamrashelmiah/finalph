<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <!-- Android Chrome Theme Color -->
    <meta name="theme-color" content="#7b5fe2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#5a4a9c" media="(prefers-color-scheme: dark)">
    
    <!-- Apple Safari Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PocketHisab">
    
    <title>PocketHisab - Forgot Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Fix for Safari Bottom Bar - UPDATED */
        html {
            height: 100%;
            height: -webkit-fill-available;
            background: linear-gradient(135deg, #f0fff0 0%, #e6f7f4 100%);
            background-size: 300% 300%;
            background-attachment: fixed;
            background-color: #e6f7f4;
        }

        body {
            min-height: 100vh;
            min-height: -webkit-fill-available;
            min-height: 100dvh; /* Dynamic Viewport Height for modern browsers */
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0fff0 0%, #e6f7f4 100%);
            background-size: 300% 300%;
            background-attachment: fixed;
            animation: none;
            padding: 20px; 
            padding-top: 100px; /* For fixed navbar */
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            position: relative;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: inherit;
            background-attachment: fixed;
            z-index: -2;
            pointer-events: none;
        }

        /* Enhanced Safe Area Support */
        @supports (padding: max(0px)) {
            body {
                padding-left: max(20px, env(safe-area-inset-left));
                padding-right: max(20px, env(safe-area-inset-right));
                padding-bottom: max(20px, env(safe-area-inset-bottom));
            }
        }

        /* Rainbow Background Animation */
        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .text-orange {
            background: linear-gradient(45deg, #fd7e14, #ffc107);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: #fd7e14; /* Fallback color */
        }


        /* Navigation Bar - IMPROVED SAFE AREA */
        .navbar {
            background: linear-gradient(90deg, rgba(220, 235, 232, 0.85), rgba(210, 230, 240, 0.85));
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 30px;
            padding-top: calc(10px + env(safe-area-inset-top));
            padding-bottom: 10px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            border-radius: 0 0 15px 15px;
            transition: all 0.3s ease;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-circle {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #28a745, #218838);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(138, 109, 233, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .logo-circle i {
            color: #ffffff;
            font-size: 18px;
        }

        .nav-brand {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(45deg, #212529, #495057);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            color: #343a40;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        /* Toggle Controls */
        .nav-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Capsule Toggle Styles */
        .capsule-toggle {
            width: 70px;
            height: 32px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 20px;
            padding: 2px;
            cursor: pointer;
            position: relative;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            display: flex;
            overflow: hidden;
        }

        .toggle-track {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .toggle-thumb {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: #495057;
            transition: all 0.3s ease;
            z-index: 2;
            border-radius: 18px;
        }

        .toggle-thumb.active {
            color: #ffffff;
            background: linear-gradient(135deg, #28a745, #218838);
        }

        .toggle-icon {
            font-size: 12px;
        }

        /* Glass Card - IMPROVED FOR SAFARI */
        .glass-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px 35px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            margin-bottom: env(safe-area-inset-bottom);
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #28a745, #ffc107, #dc3545, #28a745);
            background-size: 400% 400%;
            animation: gradientAnimation 8s ease infinite;
            z-index: -1;
            border-radius: 22px;
            opacity: 0;
        }

        /* Logo */
        .logo {
            text-align: center;
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 25px;
            background: linear-gradient(45deg, #28a745, #20c997);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: #28a745; /* Fallback color */
            text-shadow: 0 2px 8px rgba(40, 167, 69, 0.2);
        }

        /* Back to Login */
        .back-link {
            text-align: center;
            margin-bottom: 25px;
        }

        .back-link a {
            color: #ffffff;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s ease;
            padding: 8px 16px;
            border-radius: 50px;
            background: linear-gradient(45deg, #fd7e14, #ffc107);
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(253, 126, 20, 0.3);
        }

        .back-link a:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(253, 126, 20, 0.4);
        }

        /* Progress Steps */
        .progress-steps {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            gap: 15px;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .step-circle {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.3s ease;
            color: #495057;
            font-size: 14px;
        }

        .step.active .step-circle {
            background: linear-gradient(135deg, #28a745, #218838);
            color: #ffffff;
        }

        .step.completed .step-circle {
            background: linear-gradient(135deg, #ffc107, #fd7e14);
            color: #ffffff;
        }

        .step-text {
            font-size: 12px;
            color: #495057;
        }

        .step.active .step-text {
            color: #495057;
            font-weight: 600;
        }

        /* Form Groups */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #495057;
            font-weight: 600;
            font-size: 13px;
        }

        .form-control {
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: 50px;
            background: rgba(0, 0, 0, 0.04);
            font-size: 15px;
            transition: all 0.3s ease;
            border: 1.5px solid rgba(0, 0, 0, 0.06);
            color: #212529;
            font-family: inherit;
        }

        .form-control:focus {
            outline: none;
            background: rgba(0, 0, 0, 0.02);
            border-color: #28a745;
            box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.15);
        }

        .form-control::placeholder {
            color: #6c757d;
        }

        /* OTP Section */
        .otp-section {
            margin: 25px 0;
            text-align: center;
        }

        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 20px 0;
        }

        .otp-input {
            width: 45px;
            height: 45px;
            text-align: center;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            background: rgba(0, 0, 0, 0.04);
            color: #212529;
            border: 1.5px solid rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
        }

        .otp-input:focus {
            outline: none;
            border-color: #28a745;
            background: rgba(0, 0, 0, 0.02);
        }

        .otp-timer {
            font-size: 14px;
            color: #495057;
            margin: 15px 0;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #28a745, #218838);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
        }

        .btn-secondary {
            background: rgba(0, 0, 0, 0.05);
            color: #495057;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn-group .btn {
            flex: 1;
        }

        /* Message Box */
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            display: none;
            font-weight: 500;
            backdrop-filter: blur(10px);
        }

        .message.success {
            background: rgba(40, 167, 69, 0.8);
            color: #ffffff;
            border: 1px solid rgba(40, 167, 69, 0.6);
        }

        .message.error {
            background: rgba(220, 53, 69, 0.8);
            color: #ffffff;
            border: 1px solid rgba(220, 53, 69, 0.6);
        }

        .message.info {
            background: rgba(23, 162, 184, 0.8);
            color: #ffffff;
            border: 1px solid rgba(23, 162, 184, 0.6);
        }

        /* Password Strength */
        .password-strength {
            margin-top: 8px;
            height: 4px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.15);
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
        }

        .strength-weak {
            background: #dc3545;
            width: 33%;
        }

        .strength-medium {
            background: #ffc107;
            width: 66%;
        }

        .strength-strong {
            background: #28a745;
            width: 100%;
        }

        .password-strength-text {
            font-size: 10px;
            color: #495057;
            font-weight: 500;
            flex-shrink: 0;
        }

        /* Error Message Styles */
        .error-message {
            color: #ef9a9a;
            font-size: 11px;
            margin-top: 4px;
            display: none;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .navbar {
                padding: 8px 20px;
                padding-top: calc(8px + env(safe-area-inset-top));
                flex-wrap: wrap;
                gap: 8px;
            }
            
            .nav-left {
                order: 1;
                flex: 1;
            }
            
            .nav-controls {
                order: 2;
            }
            
            .nav-center {
                order: 3;
                flex: 1 1 100%;
                justify-content: center;
                margin-top: 8px;
            }
            
            .nav-links {
                gap: 12px;
            }
            
            .nav-links a {
                font-size: 13px;
                padding: 6px 12px;
            }
            
            .capsule-toggle {
                width: 65px;
                height: 28px;
            }
            
            .nav-brand {
                font-size: 1.3rem;
            }
            
            .logo-circle {
                width: 32px;
                height: 32px;
            }
            
            .logo-circle i {
                font-size: 14px;
            }
            
            .glass-card {
                padding: 30px 25px;
                margin-bottom: max(0px, env(safe-area-inset-bottom));
            }
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 6px 15px;
                padding-top: calc(6px + env(safe-area-inset-top));
            }
            
            .nav-links {
                gap: 8px;
            }
            
            .nav-links a {
                font-size: 12px;
                padding: 5px 10px;
            }
            
            .capsule-toggle {
                width: 60px;
                height: 26px;
            }
            
            .toggle-icon {
                font-size: 10px;
            }
            
            .nav-brand {
                font-size: 1.1rem;
            }
            
            .logo {
                font-size: 1.8rem;
            }
            
            body {
                padding: 15px;
                padding-bottom: calc(15px + env(safe-area-inset-bottom));
                padding-top: 70px;
            }
            
            .otp-inputs {
                gap: 5px;
            }
            
            .otp-input {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
            
            .glass-card {
                width: calc(100% - 24px);
                padding: 25px 20px;
            }
        }

        /* Dark Mode Styles - FIXED */
        body.dark-mode {
            background: #000000;
            background-size: 400% 400%;
            animation: gradientAnimation 25s ease infinite;
        }

        body.dark-mode .navbar {
            background: linear-gradient(90deg, rgba(30, 144, 255, 0.15), rgba(138, 43, 226, 0.15));
            border-bottom-color: rgba(255, 255, 255, 0.1);
        }

        body.dark-mode .nav-brand {
            background: linear-gradient(45deg, #ffffff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        body.dark-mode .nav-links a {
            color: rgba(255, 255, 255, 0.8);
        }

        body.dark-mode .nav-links a:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        body.dark-mode .nav-links a.active {
            color: #00BFFF;
            background: rgba(0, 191, 255, 0.1);
        }

        body.dark-mode .toggle-thumb.active {
            background: linear-gradient(135deg, #00BFFF, #1E90FF);
            color: #ffffff;
        }

        body.dark-mode .glass-card {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }

        body.dark-mode .glass-card::before {
            background: linear-gradient(45deg, #222, #444, #222, #444);
            opacity: 0.2;
        }

        body.dark-mode .logo {
            background: linear-gradient(45deg, #28a745, #20c997);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 8px rgba(40, 167, 69, 0.3);
        }

        body.dark-mode .step-circle {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
        }

        body.dark-mode .step.active .step-circle {
            background: linear-gradient(135deg, #00BFFF, #1E90FF);
            color: #ffffff;
        }

        body.dark-mode .step.completed .step-circle {
            background: linear-gradient(135deg, #FF00FF, #8A2BE2);
        }

        body.dark-mode .step-text {
            color: rgba(255, 255, 255, 0.7);
        }

        body.dark-mode .step.active .step-text {
            color: rgba(255, 255, 255, 0.9);
        }

        body.dark-mode .form-group label {
            color: rgba(255, 255, 255, 0.8);
        }

        body.dark-mode .form-control {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        body.dark-mode .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #00BFFF;
            box-shadow: 0 0 0 3px rgba(0, 191, 255, 0.2);
        }

        body.dark-mode .otp-input {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        body.dark-mode .otp-timer {
            color: rgba(255, 255, 255, 0.8);
        }

        body.dark-mode .btn-secondary {
            background: rgba(255, 255, 255, 0.15);
        }

        body.dark-mode .password-strength {
            background: rgba(255, 255, 255, 0.15);
        }

        body.dark-mode .password-strength-text {
            color: rgba(255, 255, 255, 0.7);
        }

        /* Safari Compatibility */
        .navbar,
        .glass-card {
            -webkit-backdrop-filter: blur(20px);
        }

        /* Enhanced Safe Area Support for iOS */
        @supports (padding: max(0px)) {
            .navbar {
                padding-left: max(30px, env(safe-area-inset-left));
                padding-right: max(30px, env(safe-area-inset-right));
            }
        }

        /* Fix for very small screens */
        @media (max-height: 600px) {
            body {
                align-items: flex-start;
                padding-top: 70px;
            }
            
            .glass-card {
                margin-top: 20px;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-left">
            <div class="logo-container">
                <div class="logo-circle">
                    <i class="fas fa-wallet"></i>
                </div>
                <div class="nav-brand">PocketHisab</div>
            </div>
        </div>

        <div class="nav-center">
            <div class="nav-links">
                <a href="index.html" id="navHome">Home</a>
                <a href="features.html" id="navFeatures">Features</a>
                <a href="pricing.html" id="navPricing" class="active">Pricing</a>
                <a href="contact.html" id="navContact">Contact</a>
            </div>
        </div>

        <div class="nav-controls">
            <!-- Dark/Light Mode Toggle -->
            <div class="capsule-toggle" id="darkModeToggle">
                <div class="toggle-track">
                    <div class="toggle-thumb active">
                        <span class="toggle-icon">☀️</span>
                    </div>
                    <div class="toggle-thumb">
                        <span class="toggle-icon">🌙</span>
                    </div>
                </div>
            </div>
            
            <!-- Language Toggle -->
            <div class="capsule-toggle" id="languageToggle">
                <div class="toggle-track">
                    <div class="toggle-thumb active">
                        <span class="toggle-icon">EN</span>
                    </div>
                    <div class="toggle-thumb">
                        <span class="toggle-icon">BN</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="glass-card">
        <!-- Logo -->
        <div class="logo">PocketHisab</div>
        
        <!-- Back to Login with Typewriter Effect -->
        <div class="back-link">
            <a href="index.html">
                ← <span id="backText">Back to Login</span>
            </a>
        </div>

        <!-- Progress Steps -->
        <div class="progress-steps">
            <div class="step active" id="step1">
                <div class="step-circle">1</div>
                <div class="step-text" id="step1Text">Enter Email/Mobile</div>
            </div>
            <div class="step" id="step2">
                <div class="step-circle">2</div>
                <div class="step-text" id="step2Text">Verify OTP</div>
            </div>
            <div class="step" id="step3">
                <div class="step-circle">3</div>
                <div class="step-text" id="step3Text">New Password</div>
            </div>
        </div>

        <!-- Forgot Password Form -->
        <form id="forgotPasswordForm">
            <!-- Step 1: Enter Email/Mobile -->
            <div class="step-content" id="step1Content">
                <div class="form-group">
                    <label for="userInput" id="userInputLabel">Email or Mobile Number *</label>
                    <input type="text" id="userInput" class="form-control" placeholder="Enter your email or mobile number" required>
                    <div class="error-message" id="userInputError"></div>
                </div>

                <button type="button" class="btn btn-primary" onclick="sendOTP()" id="sendOtpBtn">Send OTP</button>
            </div>

            <!-- Step 2: Verify OTP -->
            <div class="step-content" id="step2Content" style="display: none;">
                <div class="otp-section">
                    <h3 id="verifyTitle">Verify Your Identity</h3>
                    <p id="otpSentTo">
                        OTP sent to your registered email/mobile
                    </p>
                    
                    <div class="otp-inputs">
                        <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 1)">
                        <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 2)">
                        <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 3)">
                        <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 4)">
                        <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 5)">
                        <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 6)">
                    </div>
                    
                    <div class="otp-timer" id="otpTimer">
                        <span id="resendText">Resend OTP in:</span> <span id="timer">02:00</span>
                    </div>
                    
                    <button type="button" class="btn btn-secondary" onclick="resendOTP()" id="resendBtn" disabled>
                        <span id="resendBtnText">Resend OTP</span>
                    </button>
                </div>

                <div class="btn-group">
                    <button type="button" class="btn btn-secondary" onclick="previousStep(1)">
                        ← <span id="backBtnText">Back</span>
                    </button>
                    <button type="button" class="btn btn-primary" onclick="verifyOTP()" id="verifyBtn">
                        <span id="verifyBtnText">Verify OTP</span>
                    </button>
                </div>
            </div>

            <!-- Step 3: Set New Password -->
            <div class="step-content" id="step3Content" style="display: none;">
                <div class="form-group">
                    <label for="newPassword" id="newPasswordLabel">New Password *</label>
                    <input type="password" id="newPassword" class="form-control" placeholder="Enter new password" required oninput="checkPasswordStrength()">
                    <div class="password-strength-container">
                        <div class="password-strength">
                            <div class="strength-bar" id="strengthBar"></div>
                        </div>
                        <div class="password-strength-text" id="passwordStrengthText"></div>
                    </div>
                    <div class="error-message" id="newPasswordError"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" id="confirmPasswordLabel">Confirm New Password *</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm new password" required oninput="checkPasswordMatch()">
                    <div class="error-message" id="confirmPasswordError"></div>
                </div>

                <div class="btn-group">
                    <button type="button" class="btn btn-secondary" onclick="previousStep(2)">
                        ← <span id="backBtn2Text">Back</span>
                    </button>
                    <button type="button" class="btn btn-primary" onclick="resetPassword()" id="resetBtn">
                        <span id="resetBtnText">Reset Password</span>
                    </button>
                </div>
            </div>
        </form>

        <!-- Message Box -->
        <div id="message" class="message"></div>
    </div>

    <script>
        // Current states
        let currentStep = 1;
        let userInput = '';
        let otpTimer;
        let canResendOTP = false;
        let isEnglish = true;
        let isDarkMode = false;

        // Language texts
        const translations = {
            en: {
                backText: "Back to Login",
                step1Text: "Enter Email/Mobile",
                step2Text: "Verify OTP",
                step3Text: "New Password",
                userInputLabel: "Email or Mobile Number *",
                sendOtpBtn: "Send OTP",
                verifyTitle: "Verify Your Identity",
                otpSentTo: "OTP sent to your registered email/mobile",
                resendText: "Resend OTP in:",
                resendBtnText: "Resend OTP",
                backBtnText: "Back",
                verifyBtnText: "Verify OTP",
                newPasswordLabel: "New Password *",
                confirmPasswordLabel: "Confirm New Password *",
                passwordReqText: "Password must be at least 6 characters long",
                backBtn2Text: "Back",
                resetBtnText: "Reset Password",
                sendingOtp: "Sending OTP...",
                otpSent: "OTP sent successfully!",
                otpResent: "OTP resent successfully!",
                verifying: "Verifying...",
                otpVerified: "OTP verified successfully!",
                resetting: "Resetting...",
                passwordReset: "Password reset successfully! Redirecting to login...",
                invalidInput: "Please enter a valid email or Bangladeshi mobile number!",
                completeOtp: "Please enter the complete 6-digit OTP!",
                passwordMismatch: "Passwords do not match!",
                shortPassword: "Password must be at least 6 characters long!",
                weakPassword: "Weak password",
                mediumPassword: "Medium strength password",
                strongPassword: "Strong password",
                darkMode: "Dark mode activated",
                lightMode: "Light mode activated",
                navHome: "Home",
                navFeatures: "Features",
                navPricing: "Pricing",
                navContact: "Contact"
            },
            bn: {
                backText: "লগইনে ফিরে যান",
                step1Text: "ইমেইল/মোবাইল দিন",
                step2Text: "ওটিপি যাচাই করুন",
                step3Text: "নতুন পাসওয়ার্ড",
                userInputLabel: "ইমেইল বা মোবাইল নম্বর *",
                sendOtpBtn: "ওটিপি পাঠান",
                verifyTitle: "আপনার পরিচয় যাচাই করুন",
                otpSentTo: "আপনার নিবন্ধিত ইমেইল/মোবাইলে ওটিপি পাঠানো হয়েছে",
                resendText: "পুনরায় ওটিপি পাঠান:",
                resendBtnText: "ওটিপি পুনরায় পাঠান",
                backBtnText: "পিছনে",
                verifyBtnText: "ওটিপি যাচাই করুন",
                newPasswordLabel: "নতুন পাসওয়ার্ড *",
                confirmPasswordLabel: "নতুন পাসওয়ার্ড নিশ্চিত করুন *",
                passwordReqText: "পাসওয়ার্ড অন্তত ৬ অক্ষরের হতে হবে",
                backBtn2Text: "পিছনে",
                resetBtnText: "পাসওয়ার্ড রিসেট করুন",
                sendingOtp: "ওটিপি পাঠানো হচ্ছে...",
                otpSent: "ওটিপি সফলভাবে পাঠানো হয়েছে!",
                otpResent: "ওটিপি পুনরায় সফলভাবে পাঠানো হয়েছে!",
                verifying: "যাচাই করা হচ্ছে...",
                otpVerified: "ওটিপি সফলভাবে যাচাই করা হয়েছে!",
                resetting: "রিসেট করা হচ্ছে...",
                passwordReset: "পাসওয়ার্ড সফলভাবে রিসেট করা হয়েছে! লগইনে রিডাইরেক্ট করা হচ্ছে...",
                invalidInput: "সঠিক ইমেইল বা বাংলাদেশি মোবাইল নম্বর দিন!",
                completeOtp: "সম্পূর্ণ ৬-অঙ্কের ওটিপি দিন!",
                passwordMismatch: "পাসওয়ার্ড মেলে না!",
                shortPassword: "পাসওয়ার্ড অন্তত ৬ অক্ষরের হতে হবে!",
                weakPassword: "দুর্বল পাসওয়ার্ড",
                mediumPassword: "মধ্যম শক্তির পাসওয়ার্ড",
                strongPassword: "শক্তিশালী পাসওয়ার্ড",
                darkMode: "ডার্ক মোড সক্রিয় করা হয়েছে",
                lightMode: "লাইট মোড সক্রিয় করা হয়েছে",
                navHome: "হোম",
                navFeatures: "ফিচারসমূহ",
                navPricing: "মূল্য",
                navContact: "যোগাযোগ"
            }
        };

        // Update page content based on language
        function updateLanguage(lang) {
            const t = translations[lang];
            const isEn = lang === 'en';

            // Update navigation menu
            document.getElementById('navHome').textContent = t.navHome;
            document.getElementById('navFeatures').textContent = t.navFeatures;
            document.getElementById('navPricing').textContent = t.navPricing;
            document.getElementById('navContact').textContent = t.navContact;

            // Update all text content
            document.getElementById('step1Text').textContent = t.step1Text;
            document.getElementById('step2Text').textContent = t.step2Text;
            document.getElementById('step3Text').textContent = t.step3Text;
            document.getElementById('userInputLabel').textContent = t.userInputLabel;
            document.getElementById('sendOtpBtn').textContent = t.sendOtpBtn;
            document.getElementById('verifyTitle').textContent = t.verifyTitle;
            document.getElementById('otpSentTo').textContent = t.otpSentTo;
            document.getElementById('resendText').textContent = t.resendText;
            document.getElementById('resendBtnText').textContent = t.resendBtnText;
            document.getElementById('backBtnText').textContent = t.backBtnText;
            document.getElementById('verifyBtnText').textContent = t.verifyBtnText;
            document.getElementById('newPasswordLabel').textContent = t.newPasswordLabel;
            document.getElementById('confirmPasswordLabel').textContent = t.confirmPasswordLabel;
            document.getElementById('passwordStrengthText').textContent = t.passwordReqText;
            document.getElementById('backBtn2Text').textContent = t.backBtn2Text;
            document.getElementById('resetBtnText').textContent = t.resetBtnText;
            
            // Update placeholders
            document.getElementById('userInput').placeholder = isEn ? "Enter your email or mobile number" : "আপনার ইমেইল বা মোবাইল নম্বর দিন";
            document.getElementById('newPassword').placeholder = isEn ? "Enter new password" : "নতুন পাসওয়ার্ড দিন";
            document.getElementById('confirmPassword').placeholder = isEn ? "Confirm new password" : "নতুন পাসওয়ার্ড নিশ্চিত করুন";

            // Update page title
            document.title = isEn ? "PocketHisab - Forgot Password" : "পকেটহিসাব - পাসওয়ার্ড ভুলে গেছেন";

            document.getElementById('backText').textContent = t.backText;
        }

        // Update Toggle Visual State
        function updateDarkModeToggle(isDark) {
            const thumbs = document.querySelectorAll('#darkModeToggle .toggle-thumb');
            thumbs[0].classList.toggle('active', !isDark);
            thumbs[1].classList.toggle('active', isDark);
        }

        function updateLanguageToggle(isEnglish) {
            const thumbs = document.querySelectorAll('#languageToggle .toggle-thumb');
            thumbs[0].classList.toggle('active', isEnglish);
            thumbs[1].classList.toggle('active', !isEnglish);
        }

        // Navigate to next step
        function nextStep(step) {
            document.querySelectorAll('.step-content').forEach(content => {
                content.style.display = 'none';
            });

            document.querySelectorAll('.step').forEach(stepEl => {
                stepEl.classList.remove('active');
                stepEl.classList.remove('completed');
            });

            for (let i = 1; i < step; i++) {
                document.getElementById('step' + i).classList.add('completed');
            }

            document.getElementById('step' + step + 'Content').style.display = 'block';
            document.getElementById('step' + step).classList.add('active');

            currentStep = step;
        }

        // Navigate to previous step
        function previousStep(step) {
            nextStep(step);
        }

        // Send OTP
        function sendOTP() {
            userInput = document.getElementById('userInput').value.trim();
            
            if (!userInput) {
                showMessage('Please enter your email or mobile number!', 'error');
                return;
            }

            const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(userInput);
            const isMobile = /^01[3-9]\d{8}$/.test(userInput);
            
            if (!isEmail && !isMobile) {
                showMessage(isEnglish ? translations.en.invalidInput : translations.bn.invalidInput, 'error');
                return;
            }

            const btn = document.getElementById('sendOtpBtn');
            const originalText = btn.textContent;
            btn.textContent = isEnglish ? translations.en.sendingOtp : translations.bn.sendingOtp;
            btn.disabled = true;

            setTimeout(() => {
                btn.textContent = originalText;
                btn.disabled = false;
                
                document.getElementById('otpSentTo').textContent = 
                    isEnglish ? 
                    `OTP sent to your ${isEmail ? 'email' : 'mobile number'}` :
                    `আপনার ${isEmail ? 'ইমেইলে' : 'মোবাইল নম্বরে'} ওটিপি পাঠানো হয়েছে`;
                
                nextStep(2);
                startOTPTimer();
                
                showMessage(isEnglish ? translations.en.otpSent : translations.bn.otpSent, 'success');
            }, 1500);
        }

        // OTP Timer
        function startOTPTimer() {
            let timeLeft = 120;
            const timerElement = document.getElementById('timer');
            const resendBtn = document.getElementById('resendBtn');
            
            clearInterval(otpTimer);
            canResendOTP = false;
            resendBtn.disabled = true;
            
            otpTimer = setInterval(() => {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                
                timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeLeft <= 0) {
                    clearInterval(otpTimer);
                    timerElement.textContent = '00:00';
                    canResendOTP = true;
                    resendBtn.disabled = false;
                }
                
                timeLeft--;
            }, 1000);
        }

        // Move to next OTP input
        function moveToNext(input, nextIndex) {
            if (input.value.length === 1) {
                const inputs = Array.from(input.parentElement.querySelectorAll('.otp-input'));
                const idx = inputs.indexOf(input);
                if (idx >= 0 && inputs[idx + 1]) inputs[idx + 1].focus();
            }
        }

        // Resend OTP
        function resendOTP() {
            if (!canResendOTP) return;
            
            startOTPTimer();
            showMessage(isEnglish ? translations.en.otpResent : translations.bn.otpResent, 'success');
        }

        // Verify OTP
        function verifyOTP() {
            const otpInputs = document.querySelectorAll('.otp-input');
            let otp = '';
            
            otpInputs.forEach(input => {
                otp += input.value;
            });
            
            if (otp.length !== 6) {
                showMessage(isEnglish ? translations.en.completeOtp : translations.bn.completeOtp, 'error');
                return;
            }

            const btn = document.getElementById('verifyBtn');
            const originalText = btn.querySelector('span').textContent;
            btn.querySelector('span').textContent = isEnglish ? translations.en.verifying : translations.bn.verifying;
            btn.disabled = true;

            setTimeout(() => {
                btn.querySelector('span').textContent = originalText;
                btn.disabled = false;
                
                nextStep(3);
                showMessage(isEnglish ? translations.en.otpVerified : translations.bn.otpVerified, 'success');
            }, 1500);
        }

        // Check password strength
        function checkPasswordStrength() {
            const password = document.getElementById('newPassword').value;
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('passwordStrengthText');
            
            let strength = 0;
            let message = '';
            
            if (password.length >= 6) strength += 1;
            if (password.length >= 8) strength += 1;
            if (/[A-Z]/.test(password)) strength += 1;
            if (/[0-9]/.test(password)) strength += 1;
            if (/[^A-Za-z0-9]/.test(password)) strength += 1;
            
            strengthBar.className = 'strength-bar';
            if (strength <= 2) {
                strengthBar.classList.add('strength-weak');
                message = isEnglish ? translations.en.weakPassword : translations.bn.weakPassword;
            } else if (strength <= 4) {
                strengthBar.classList.add('strength-medium');
                message = isEnglish ? translations.en.mediumPassword : translations.bn.mediumPassword;
            } else {
                strengthBar.classList.add('strength-strong');
                message = isEnglish ? translations.en.strongPassword : translations.bn.strongPassword;
            }
            
            strengthText.textContent = message;
        }

        // Check password match
        function checkPasswordMatch() {
            const password = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const matchError = document.getElementById('confirmPasswordError');
            
            if (confirmPassword && password !== confirmPassword) {
                matchError.textContent = isEnglish ? translations.en.passwordMismatch : translations.bn.passwordMismatch;
                matchError.style.display = 'block';
            } else {
                matchError.style.display = 'none';
            }
        }

        // Reset Password
        function resetPassword() {
            const password = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!password || !confirmPassword) {
                showMessage('Please fill in both password fields!', 'error');
                return;
            }
            
            if (password !== confirmPassword) {
                showMessage(isEnglish ? translations.en.passwordMismatch : translations.bn.passwordMismatch, 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage(isEnglish ? translations.en.shortPassword : translations.bn.shortPassword, 'error');
                return;
            }

            const btn = document.getElementById('resetBtn');
            const originalText = btn.querySelector('span').textContent;
            btn.querySelector('span').textContent = isEnglish ? translations.en.resetting : translations.bn.resetting;
            btn.disabled = true;

            setTimeout(() => {
                showMessage(isEnglish ? translations.en.passwordReset : translations.bn.passwordReset, 'success');
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            }, 1500);
        }

        // Page loaded successfully
        document.addEventListener('DOMContentLoaded', function() {
            // Load dark mode preference
            const savedDarkMode = localStorage.getItem('darkMode');
            if (savedDarkMode === 'true') {
                isDarkMode = true;
                document.body.classList.add('dark-mode');
            } else {
                isDarkMode = false;
                document.body.classList.remove('dark-mode');
            }
            updateDarkModeToggle(isDarkMode);
            
            // Load language preference
            const savedLanguage = localStorage.getItem('language');
            if (savedLanguage === 'bn') {
                isEnglish = false;
                updateLanguage('bn');
            } else {
                isEnglish = true;
                updateLanguage('en');
            }
            updateLanguageToggle(isEnglish);

            console.log('🎉 PocketHisab Forgot Password Page Loaded!');
        });

        // Dark Mode Toggle - FIXED
        document.getElementById('darkModeToggle').addEventListener('click', function(e) {
            const rect = this.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const isRightClick = clickX > rect.width / 2;
            
            if (isRightClick) {
                // Dark Mode
                isDarkMode = true;
                document.body.classList.add('dark-mode');
                updateDarkModeToggle(true);
                showMessage(isEnglish ? translations.en.darkMode : translations.bn.darkMode, 'success');
                localStorage.setItem('darkMode', 'true');
            } else {
                // Light Mode
                isDarkMode = false;
                document.body.classList.remove('dark-mode');
                updateDarkModeToggle(false);
                showMessage(isEnglish ? translations.en.lightMode : translations.bn.lightMode, 'success');
                localStorage.setItem('darkMode', 'false');
            }
        });

        // Language Toggle
        document.getElementById('languageToggle').addEventListener('click', function(e) {
            const rect = this.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const isRightClick = clickX > rect.width / 2;
            
            if (isRightClick) {
                // Bangla
                isEnglish = false;
                updateLanguage('bn');
                updateLanguageToggle(false);
                localStorage.setItem('language', 'bn');
            } else {
                // English
                isEnglish = true;
                updateLanguage('en');
                updateLanguageToggle(true);
                localStorage.setItem('language', 'en');
            }
        });
    </script>
</body>
